name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Siapkan Android SDK (bawaan runner)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Ringkasan error (jika gagal)
        if: failure()
        shell: bash
        run: |
          echo "===== BARIS ERROR ====="
          grep -nE "^e: |error:|What went wrong|FAILURE|Could not|Execution failed|requires|not found" build.log | head -40 || true

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoMerger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
